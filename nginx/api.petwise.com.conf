# sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=petwise_api:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=petwise_docs:10m rate=20r/s;

upstream petwise_web {
    server 127.0.0.1:2019;
}

upstream petwise_worker {
    server 127.0.0.1:2020;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.petwise.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.petwise.com;

    ssl_certificate /etc/letsencrypt/live/api.petwise.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.petwise.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 12m;

    location /docs {
        limit_req zone=petwise_docs burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://petwise_web;
    }

    location /api/openapi {
        limit_req zone=petwise_docs burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://petwise_web;
    }

    location /worker/ {
        limit_req zone=petwise_api burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://petwise_worker/;
    }

    location / {
        limit_req zone=petwise_api burst=30 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_pass http://petwise_web;
    }
}
