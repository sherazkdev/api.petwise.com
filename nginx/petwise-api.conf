limit_req_zone $binary_remote_addr zone=petwise-api:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=petwise-api-docs:10m rate=20r/s;

upstream petwise-api {
    server 127.0.0.1:2019;
}

upstream petwise-api-worker {
    server 127.0.0.1:2020;
}

server {
    listen 80;
    listen [::]:80;
    server_name petwise.apptechcode.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name petwise.apptechcode.com;

    ssl_certificate /etc/letsencrypt/live/petwise.apptechcode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petwise.apptechcode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 12m;

    location /docs {
        limit_req zone=petwise-api-docs burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://petwise-api;
    }

    location /api/openapi {
        limit_req zone=petwise-api-docs burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://petwise-api;
    }

    location /worker/ {
        limit_req zone=petwise-api burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://petwise-api-worker/;
    }

    location / {
        limit_req zone=petwise-api burst=30 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_pass http://petwise-api;
    }
}
